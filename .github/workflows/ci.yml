name: Tests
on:
  push:
  pull_request:
jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12.3'
          cache: pip
      - run: python -m pip install --no-compile -r requirements.txt
      - run: python -m pytest -q
        env:
          PYTHONUTF8: '1'
          OMP_NUM_THREADS: '1'
