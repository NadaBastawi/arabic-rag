version: '3.8'

services:
  arabic-rag:
    build: .
    ports:
      - "127.0.0.1:8000:8000"      # Authenticated FastAPI + HTML UI
    environment:
      - EMBEDDING_MODEL=${EMBEDDING_MODEL:-distiluse-base-multilingual-cased-v2}
      - EMBEDDING_DEVICE=cpu
      - LLM_PROVIDER=${LLM_PROVIDER:-openai}
      - LLM_MODEL=${LLM_MODEL:-gpt-4.1-mini}
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - LLM_API_KEY=${LLM_API_KEY}
      - LLM_TEMPERATURE=0.3
      - LLM_MAX_TOKENS=2048
      - RETRIEVAL_MODE=multi_stage
      - USE_ADAPTIVE=true
      - INDEX_PATH=/app/data/index
      - DOCS_PATH=/app/data/documents
      - LOG_LEVEL=INFO
      - API_HOST=0.0.0.0
      - API_PORT=8000
      - GRADIO_PORT=7860
      - GRADIO_SHARE=false
      - AUTH_ENABLED=true
      - LOCAL_DEV_MODE=${LOCAL_DEV_MODE:-false}
      - PRIVATE_DEV_MODE=${PRIVATE_DEV_MODE:-false}
      - AUTH_TOKEN=${AUTH_TOKEN}
      - AUTH_WORKSPACE_ID=${AUTH_WORKSPACE_ID:-codespace-user}
      - MAX_UPLOAD_BYTES=26214400
    volumes:
      - ./data:/app/data
      - ./logs:/app/logs
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

volumes:
  data:
  logs:
